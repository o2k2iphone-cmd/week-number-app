<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="週番確認">
  <meta name="description" content="当社の年度週番をすばやく確認。オフラインでも使えるシンプルな週番アプリ。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>週番確認</title>
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="app-header">
      <img class="app-mark" src="./icons/icon.svg" width="40" height="40" alt="">
      <div>
        <h1>週番確認</h1>
        <p>年度週番をすばやく確認</p>
      </div>
    </header>

    <main>
      <section class="today-card" aria-labelledby="todayHeading">
        <div class="today-top">
          <h2 id="todayHeading">今週の週番</h2>
          <span id="todayDate"></span>
        </div>
        <div class="today-week"><span id="todayWeek">--</span><span class="week-suffix">週</span></div>
        <div class="today-details">
          <strong id="todayCode">------</strong>
          <span id="todayStart">開始日を確認中</span>
        </div>
        <button class="speak-button speak-on-dark" id="speakToday" type="button" hidden>読み上げ</button>
      </section>

      <nav class="mode-switch" aria-label="機能を切り替え">
        <button type="button" class="mode-button is-active" data-mode="week" aria-pressed="true">週番 → 日付</button>
        <button type="button" class="mode-button" data-mode="date" aria-pressed="false">日付 → 週番</button>
        <button type="button" class="mode-button" data-mode="batch" aria-pressed="false">一括TSV</button>
      </nav>

      <section class="tool-panel" id="weekPanel" aria-label="週番から日付を調べる">
        <label class="field-label" for="weekInput">調べたい週番</label>
        <input id="weekInput" class="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例：2025年25週 / 202525" aria-describedby="weekHint">
        <p class="field-hint" id="weekHint">iPhoneでは入力欄をタップし、キーボードの🎤で音声入力できます。</p>
        <div class="result-card" id="weekResultCard" aria-live="polite">
          <p class="result-label">開始日</p>
          <div class="result-value" id="weekResult">週番を入力してください</div>
          <p class="result-meta" id="weekResultMeta"></p>
          <button class="speak-button" id="speakWeek" type="button" hidden>結果を読み上げ</button>
        </div>
      </section>

      <section class="tool-panel" id="datePanel" aria-label="日付から週番を調べる" hidden>
        <label class="field-label" for="dateInput">調べたい日付</label>
        <input id="dateInput" class="text-input date-input" type="date">
        <div class="result-card" id="dateResultCard" aria-live="polite">
          <p class="result-label">週番</p>
          <div class="result-value result-code" id="dateResult">------</div>
          <p class="result-meta" id="dateResultMeta"></p>
          <button class="speak-button" id="speakDate" type="button" hidden>結果を読み上げ</button>
        </div>
      </section>

      <section class="tool-panel batch-panel" id="batchPanel" aria-label="一括TSV変換" hidden>
        <div class="batch-heading">
          <div>
            <h2>一括TSV変換</h2>
            <p>週番と開始日を2行で出力します。</p>
          </div>
          <div class="view-actions">
            <button type="button" class="small-button" id="wideButton" aria-pressed="false">広く表示</button>
            <button type="button" class="small-button" id="fullscreenButton" hidden>全画面</button>
          </div>
        </div>
        <form id="batchForm">
          <div class="range-fields">
            <div>
              <label class="field-label" for="startWeek">開始週</label>
              <input id="startWeek" class="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="202525" required>
            </div>
            <div>
              <label class="field-label" for="endWeek">終了週</label>
              <input id="endWeek" class="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="202530" required>
            </div>
          </div>
          <button class="primary-button" type="submit">TSVを生成</button>
        </form>
        <p class="batch-message" id="batchMessage" role="status">例：202525 ～ 202530</p>
        <div class="batch-output" id="batchOutputWrap" hidden>
          <div class="output-heading">
            <label class="field-label" for="tsvOutput">貼り付け用TSV</label>
            <span id="batchCount"></span>
          </div>
          <textarea id="tsvOutput" class="tsv-output" readonly rows="3" spellcheck="false"></textarea>
          <button class="copy-button" id="copyButton" type="button">TSVをコピー</button>
        </div>
      </section>
    </main>

    <footer>3月1日を含む週から始まる年度週番</footer>
  </div>
  <script defer src="./week.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
